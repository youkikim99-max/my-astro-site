name: Deploy to Aliyun

on:
  push:
    branches:
      - main
  # 允许在 GitHub 网页上手动触发一次部署
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建静态站点
        run: npm run build

      - name: 通过 FTP 上传到阿里云
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: byu4517730001.my3w.com
          username: byu4517730001
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: dist/
          server-dir: htdocs/
          timeout: 300000
